name: Bug report
description: Report a problem with steps to reproduce it.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected page or command and the steps that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include relevant errors or screenshots if useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the site URL or commit, browser, device/OS, and Node/Yarn versions as relevant.
    validations:
      required: true
